<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>秋秋音乐迷你播放器</title>
  <link rel="stylesheet" href="floating.css">
</head>
<body>
  <main class="widget" aria-label="秋秋音乐迷你播放器">
    <button class="record" type="button" aria-label="打开秋秋音乐">
      <span class="groove groove-one"></span><span class="groove groove-two"></span>
      <span class="label"><span class="note">♪</span></span>
    </button>
    <button class="close" type="button" aria-label="退出秋秋音乐" title="退出秋秋音乐">×</button>
    <span class="track" aria-live="polite"></span>
  </main>
  <script src="floating.js"></script>
</body>
</html>
